name: CI Build
run-name: Build on branch ${{github.ref_name}} triggered by ${{github.actor}}

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: [ubuntu-latest]
    strategy:
      fail-fast: true
    env:
      testDirectory: market-test/pom.xml
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7

      - name: Editor checker
        uses: editorconfig-checker/action-editorconfig-checker@main

      - run: editorconfig-checker -verbose --no-color

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Build source
        shell: bash
        run: |
          cd market-test
          mvn compile exec:java -Dexec.mainClass="com.axonivy.market.CreateBundle" -Dmaven.plugin.validation=none -DskipTests
          mvn verify -P json.schema -Dmaven.plugin.validation=none -DfailFast=true
          cd ../

      - name: Archive build artifact
        uses: actions/upload-artifact@v7
        with:
          path: |
            market-test/target/market/*/*/*.json
            market-test/target/market/*/*/logo*.png

      - name: Public test report
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        if: success() || failure()
        with:
          files: "**/target/surefire-reports/**/*.xml"

  publish-maven:
    name: Publish Maven package
    needs: validate
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN

      - name: Build market bundle
        working-directory: market-test
        run: mvn compile exec:java -Dexec.mainClass="com.axonivy.market.CreateBundle" -Dmaven.plugin.validation=none -DskipTests

      - name: Deploy Maven package
        working-directory: market-test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn deploy -Dmaven.plugin.validation=none -DskipTests


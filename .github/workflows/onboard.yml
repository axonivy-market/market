name: Onboard Product
run-name: Onboard ${{ inputs.source-repository }} triggered by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      source-repository:
        description: "Source repository URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  onboard:
    name: Onboard product repository
    runs-on: [ubuntu-latest]
    environment: onboarding
    env:
      MARKET_ORG: axonivy-market
      GH_TOKEN: ${{ secrets.MARKET_ORG_TOKEN }}
      SOURCE_REPOSITORY: ${{ inputs.source-repository }}
    steps:
      - name: Checkout market repository
        uses: actions/checkout@v4

      - name: Validate token
        shell: bash
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing MARKET_ORG_TOKEN secret. The token must be able to create forks in ${MARKET_ORG} and push branches."
            exit 1
          fi

      - name: Parse source repository
        id: repository
        shell: bash
        run: |
          repository="${SOURCE_REPOSITORY%.git}"
          repository="${repository%/}"
          repository_name="${repository##*/}"
          repository_owner="$(basename "$(dirname "${repository}")")"

          if [[ ! "${repository}" =~ ^https://github\.com/[^/]+/[^/]+$ ]] || [ -z "${repository_name}" ]; then
            echo "Source repository must be a GitHub repository URL, e.g. https://github.com/someuser/some-connector"
            exit 1
          fi

          echo "name=${repository_name}" >> "${GITHUB_OUTPUT}"
          echo "owner=${repository_owner}" >> "${GITHUB_OUTPUT}"
          echo "target=${MARKET_ORG}/${repository_name}" >> "${GITHUB_OUTPUT}"
          echo "url=${repository}" >> "${GITHUB_OUTPUT}"

      - name: Fork source repository
        shell: bash
        run: |
          gh repo fork "${{ steps.repository.outputs.owner }}/${{ steps.repository.outputs.name }}" \
            --org "${MARKET_ORG}" \
            --clone=false
          git clone "${SOURCE_REPOSITORY}" source

      - name: Prepare Market pull request base
        shell: bash
        working-directory: source
        run: |
          first_commit="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          source_branch="$(gh repo view "${{ steps.repository.outputs.owner }}/${{ steps.repository.outputs.name }}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          gh auth setup-git
          target_url="https://github.com/${{ steps.repository.outputs.target }}.git"

          git push "${target_url}" "${first_commit}:refs/heads/master"
          gh api --method PATCH "repos/${{ steps.repository.outputs.target }}" -f default_branch=master

          echo "source_branch=${source_branch}" >> "${GITHUB_OUTPUT}"

      - name: Create onboarding pull request
        id: pull-request
        shell: bash
        working-directory: source
        run: |
          cat > pr-body.md <<EOF
          Onboards ${SOURCE_REPOSITORY} into the Axon Ivy Market.

          Source repository: ${SOURCE_REPOSITORY}
          Source owner: @${{ steps.repository.outputs.owner }}
          Triggered by: @${GITHUB_ACTOR}

          @copilot review this onboarding pull request against the Axon Ivy Market onboarding checklist below.
          For each checklist item, report either PASS, FAIL, or NEEDS HUMAN REVIEW.
          Do not mark checklist boxes as completed unless the repository content clearly proves the item is satisfied.
          Leave concrete review comments for each FAIL item and summarize all NEEDS HUMAN REVIEW items in your review overview.

          EOF

          sed -n '/^# Review Tasks/,$p' ../.github/ISSUE_TEMPLATE/onboard-to-market.md >> pr-body.md

          pr_url="$(gh pr create \
            --repo "${{ steps.repository.outputs.target }}" \
            --base master \
            --head "${{ steps.repository.outputs.owner }}:${{ steps.repository.outputs.source_branch }}" \
            --title "Onboard ${{ steps.repository.outputs.name }}" \
            --body-file pr-body.md \
            --reviewer "${GITHUB_ACTOR}" \
            --reviewer "@copilot")"

          echo "${pr_url}"
          echo "url=${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: Link onboarding issue
        shell: bash
        run: |
          issue_url="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state all \
            --search "\"${{ steps.repository.outputs.url }}\" in:body" \
            --json url \
            --jq '.[0].url')"

          if [ -n "${issue_url}" ]; then
            gh pr comment "${{ steps.pull-request.outputs.url }}" \
              --repo "${{ steps.repository.outputs.target }}" \
              --body "Related onboarding issue: ${issue_url}"
          else
            echo "No onboarding issue found for ${{ steps.repository.outputs.url }}; continuing without issue link."
          fi